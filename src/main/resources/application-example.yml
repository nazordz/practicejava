# Example JWT configuration.
#
# The real application.yml is gitignored (secrets policy), so copy this file to
# src/main/resources/application.yml — or supply the values as environment
# variables — and replace the secret with your own. Generate one with:
#
#   openssl rand -base64 64
#
# JwtProperties no longer carries built-in defaults, so the practicejava.jwt
# values below (or the equivalent environment variables) are required for the
# app to start.
spring:
  application:
    name: practicejava
  # PostgreSQL Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Schema is owned by Liquibase; Hibernate must not mutate it.
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        '[format_sql]': true
  threads:
    virtual:
      enabled: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  cache:
    type: redis
  data:
    redis:
      url: redis://localhost:6379

practicejava:
  jwt:
    secret: ${PRACTICEJAVA_JWT_SECRET:replace-me-with-a-base64-encoded-256-bit-or-larger-secret}
    cookie-name: practicejava-jwt
    refresh-cookie-name: practicejava-refresh-jwt
    expiration-ms: 3600000        # access token: 1 hour
    refresh-expiration-ms: 86400000  # refresh token: 24 hours

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized